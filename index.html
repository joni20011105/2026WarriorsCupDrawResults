<style>

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
 color:var(--ink);background:radial-gradient(130% 80% at 15% 0%,#F4F0E5 0%,var(--paper) 52%,#DBD2BE 100%);

body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;z-index:0;

.hd{max-width:1240px;margin:0 auto;padding:0 var(--gut);position:relative}

@supports not (background-clip:text){.hd h1{-webkit-text-fill-color:#C9CDD2}}

.hd .sub b{color:#D8DCE0;font-weight:500}

.tools{position:sticky;top:0;z-index:5;background:rgba(242,237,225,.94);backdrop-filter:blur(8px);

.tools .in{max-width:1240px;margin:0 auto;padding:0 var(--gut);display:flex;gap:12px;align-items:center;flex-wrap:wrap}

.btn:hover{background:var(--ink);color:var(--paper2)}

.hit{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px dashed var(--line);font-size:14px;flex-wrap:wrap}
.hit:first-of-type{border-top:0}
.hit .who{font-weight:700}
.hit .where{color:var(--muted);font-size:12.5px}
.hit .go{margin-left:auto;background:var(--navy);color:#F2EDE1;border:0;padding:4px 10px;border-radius:2px;
 font-size:12px;cursor:pointer;font-family:inherit}

section{margin-top:44px;scroll-margin-top:76px}
.tabs{display:flex;border:1px solid var(--navy);border-radius:3px;overflow:hidden;flex:none}
.tab{border:0;background:transparent;color:var(--navy);padding:8px 15px;font-size:13.5px;
 font-family:inherit;cursor:pointer;font-weight:500}
.tab.on{background:var(--navy);color:var(--paper2)}
.datebadge{display:inline-flex;align-items:center;gap:5px;background:var(--navy);color:var(--paper2);

.datebadge.split{background:#4A5F82}

.calhd{border-bottom:2px solid var(--ink);padding-bottom:11px;margin-bottom:20px}

 letter-spacing:.07em;font-weight:900}
.notice{border:2px solid var(--seal);background:#FBF2EF;border-radius:4px;padding:18px 20px;margin-bottom:28px}

.notice p{margin:0 0 9px;font-size:14.5px;line-height:1.95;color:var(--ink)}
.notice p:last-child{margin-bottom:0}
.notice .em{font-weight:700;color:var(--seal)}

.daygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:18px}
.daycard{background:linear-gradient(178deg,#FFFDF7,#F6F0E1);border:1px solid #C8BB9E;border-radius:3px;
 clip-path:polygon(0 13px,13px 0,calc(100% - 13px) 0,100% 13px,100% 100%,0 100%);
 padding:16px 16px 14px;box-shadow:0 2px 8px rgba(60,45,20,.07)}
.daycard h3{font-family:"Noto Serif TC",serif;font-size:23px;margin:0;letter-spacing:.08em;font-weight:900}
.daycard .dsub{font-size:11.5px;color:var(--muted);letter-spacing:.14em;margin-top:4px;
 border-bottom:1px solid var(--line);padding-bottom:9px}
.daycard .dwarn{color:var(--seal);letter-spacing:.02em;font-size:11px}
.daycard ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.daycard li{display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.5}
.daycard li .dv{color:var(--muted);font-size:12px;min-width:104px;flex:none}
.daycard li .it{font-weight:500}
.daycard li.sp{background:#EDF1F7;border-left:3px solid var(--navy2);padding:6px 9px;border-radius:2px}
.daycard li.sp .it{color:#2C4A63}
.sechd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:11px}
.sechd .eyebrow{font-size:11.5px;letter-spacing:.3em;color:var(--muted)}
.sechd h2{font-family:"Noto Serif TC",serif;font-size:clamp(22px,3.2vw,30px);margin:3px 0 0;
 letter-spacing:.07em;font-weight:900}
.sechd .meta{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.7}

.fnote{margin-top:12px;background:#EDF1F7;border-left:3px solid var(--navy2);padding:9px 13px;

.fnote.onsite{background:#FBF2EF;border-left-color:var(--seal);color:#8C2C22}

.fnote.plain{background:#F3F0E7;border-left-color:#B9AB8D;color:var(--muted)}

.fnote.adv .ftag{background:#4E6B4A}

.sd{display:inline-block;background:var(--seal);color:#fff;font-size:9.5px;padding:0 4px;border-radius:2px;margin-left:4px}

.mt .sd2+.sd2{border-top:1px dashed var(--line)}

.mt .bye{color:#A89C86}

footer{margin-top:60px;border-top:1px solid var(--line);padding-top:16px;font-size:11.5px;color:var(--muted);line-height:1.9}

}

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let hl=new Set();

/* ---------- 多邊形：頂點是參賽者，連線是要打的每一場 ---------- */
function wrap(t,max){
  t=String(t||''); const out=[];
  while(t.length>max){ out.push(t.slice(0,max)); t=t.slice(max); }
  if(t.length) out.push(t);
  return out;
}
function nameLines(nm){
  const parts=String(nm||'').split('／').filter(Boolean);
  if(parts.length>1 && nm.length>9) return parts;      // 雙打／3v3 名字太長就一人一行
  return wrap(nm,10);
}
function poly(m){
  const n=m.length;
  const LH=14, NODE=17, GAP=27, W=320;
  let pts,dir;
  if(n===2){ pts=[[80,0],[240,0]]; dir=['d','d']; }
  else if(n===3){ pts=[[160,0],[66,110],[254,110]]; dir=['u','d','d']; }
  else { pts=[[86,0],[234,0],[234,98],[86,98]]; dir=['u','u','d','d']; }

  // 先算出每個頂點的文字行數，再決定畫布高度與整體位移
  const L=m.map(p=>{
    const l=[];
    nameLines(p.nm).forEach(t=>l.push([t,'nm']));
    if(p.u) wrap(p.u,10).forEach(t=>l.push([t,'un']));
    return l;
  });
  let up=0,down=0;
  m.forEach((p,i)=>{
    if(dir[i]==='u') up=Math.max(up,L[i].length);
    else down=Math.max(down,L[i].length);
  });
  const top = up? GAP+(up-1)*LH+10 : NODE+8;
  const bottomRow = Math.max(...pts.map(q=>q[1]));
  const H = top + bottomRow + GAP + 4 + (down-1)*LH + 10;

  let edges='',nodes='';
  const P=pts.map(q=>[q[0],q[1]+top]);
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++)
    edges+=`<line class="edge" x1="${P[i][0]}" y1="${P[i][1]}" x2="${P[j][0]}" y2="${P[j][1]}"/>`;
  m.forEach((p,i)=>{
    const [x,y]=P[i];
    const on=hl.size&&(hl.has(p.nm)||(p.u&&hl.has(p.u)));
    nodes+=`<circle class="node${p.s?' seed':''}" cx="${x}" cy="${y}" r="${NODE}"/>`
      +`<text class="num${p.s?' seed':''}" x="${x}" y="${y}">${p.n}</text>`;
    if(p.s) nodes+=`<text class="sdmark" x="${x+20}" y="${y-12}">種${p.s}</text>`;
    const tot=L[i].length;
    L[i].forEach(([t,cls],k)=>{
      const by = dir[i]==='u' ? y-GAP-(tot-1-k)*LH : y+GAP+4+k*LH;
      nodes+=`<text class="${cls}" x="${x}" y="${by}"${on&&cls==='nm'?' style="fill:#B4362A;font-weight:700"':''}>${esc(t)}</text>`;
    });
  });
  return `<svg class="poly" viewBox="0 0 ${W} ${H}" role="img">${edges}${nodes}</svg>`;
}

function card(ev,g){
  const n=g.members.length;
  const on=hl.size&&g.members.some(p=>hl.has(p.nm)||(p.u&&hl.has(p.u)));
  const list=g.members.map(p=>`<div class="rw">
      <span class="rn">${p.n}</span>
      <div class="rt"><div class="rnm">${esc(p.nm)}${p.s?`<span class="sd">種${p.s}</span>`:''}</div>
        ${p.u?`<div class="runit"><span class="utag">單位</span>${esc(p.u)}</div>`:''}
        ${p.mem?`<div class="rmem">${esc(p.mem)}</div>`:''}</div></div>`).join('');
  return `<div class="card${on?' hl':''}">
    <div class="ch"><span class="gl serif">${esc(g.g.replace('組',''))}</span>
      <span class="cnt2">${n} 隊・${n*(n-1)/2} 場循環<br><b class="adv2">取 ${advOf(ev,g)} 名晉級</b></span>
      <span class="shape serif">${KJ[n]||n}</span></div>
    ${poly(g.members)}
    <div class="roster">${list}</div></div>`;
}

const DT=JSON.parse(document.getElementById('dates').textContent);
const DMAP={};
DT.forEach(r=>{
  const base=r.item.replace(/（.*?）/,''), suf=(r.item.match(/（(.*?)）/)||[])[1]||'';
  const k=r.div+'|'+base;
  (DMAP[k]=DMAP[k]||[]).push({day:r.day,suf});
});
const SPECIAL=['開幕典禮','社會組巔峰對決'];
function dateBadge(div,item){
  const a=DMAP[div+'|'+item]; if(!a) return '';
  if(a.length===1) return `<span class="datebadge">${esc(a[0].day)}</span>`;
  return a.map(x=>`<span class="datebadge split">${esc(x.day)}　${esc(x.suf)}</span>`).join(' ');
}
/* 各項目晉級規則：預設三取一、四取二；下列為例外 */
const ADV={
  '競技專業團體組|三點雙打':{all:2,
    note:'各小組皆取前二名晉級決賽（三取二，D 組為四隊即四取二）。'},
  '壯年團體組|三點雙打':{by:{'A組':2},
    note:'因隊數較少並考量決賽籤位總數，故 A 組三取二；B 組為四隊，四取二。'},
  '競技青壯年專業組|混雙':{by:{'A組':2},
    note:'A 組為第一種子小組，並考量決賽籤位總數，故三取二；其餘小組三取一。'},
  '壯年組|女雙':{by:{'A組':2,'B組':2},
    note:'A 組為第一種子小組，並考量決賽籤位總數，故三取二；B 組二取二。'},
  '壯年組|混雙':{by:{'A組':2,'B組':1,'C組':1},
    note:'A 組為第一種子小組，並考量決賽籤位總數，故三取二；B 組、C 組三取一。'},
  '國小中年級（含）以下|女雙':{by:{'A組':2,'B組':2},
    note:'因僅五組報名並考量決賽籤位總數，故 A 組三取二、B 組二取二。'},
};
function advOf(ev,g){
  const r=ADV[ev.div+'|'+ev.item], n=g.members.length;
  if(r){ if(r.all) return r.all; if(r.by&&r.by[g.g]!=null) return r.by[g.g]; }
  return n===3?1:(n===4?2:n);          // 預設：三取一、四取二、二取二
}
function advNote(ev){
  if(ev.groups.length<=1) return '';
  const r=ADV[ev.div+'|'+ev.item];
  return `<div class="fnote adv"><span class="ftag">晉級決賽</span>${
    r?r.note:'三角取一、四邊取二晉級決賽。'}</div>`;
}
const ONSITE_DIV='競技專業團體組';        // 競技青年團體：現場抽籤
function finalNote(ev){
  if(ev.groups.length<=1)
    return `<div class="fnote plain">本項目僅一個小組，採循環賽直接決定名次，無決賽。</div>`;
  if(ev.div===ONSITE_DIV)
    return `<div class="fnote onsite"><span class="ftag">決賽籤位</span>賽事當日現場由各隊進行抽籤。</div>`;
  return `<div class="fnote"><span class="ftag">決賽籤位</span>一律由武士盃競賽系統重新自動抽籤決賽籤位，於賽事當日預賽完賽後自動公告。</div>`;
}
function calendar(){
  const days=[...new Set(DT.map(r=>r.day))];
  return `<div class="calhd"><div class="eyebrow">預定版本・非最終賽程</div>
      <h2 class="serif">各項目競賽日期</h2></div>
    <div class="notice">
      <h3 class="serif">重點須知</h3>
      <p>此為賽事各項目比賽日期<span class="em">預定版本</span>，目前先提供給各位參賽選手參考。因目前正在安排各項目實際賽程時間，故武士盃競賽團隊仍保有各項目競賽日期之<span class="em">最終調整權</span>，請各位選手多多包涵。</p>
      <p>目前此預定版本<span class="em">尚未安排各項目進行的順序</span>，以下資訊<span class="em">並非</span>依先後順序進行。</p>
      <p>武士盃競賽團隊預計 <span class="em">9/9 前</span>公告第二屆武士盃全國羽球錦標賽最終完整賽程資訊。</p>
    </div>
    <div class="daygrid">${days.map(d=>{
      const rows=DT.filter(r=>r.day===d);
      return `<div class="daycard"><h3 class="serif">${esc(d)}</h3>
        <div class="dsub">2026 年・共 ${rows.filter(r=>!SPECIAL.includes(r.div)).length} 個項目<br>
          <span class="dwarn">以下排列順序不代表當日進行順序</span></div>
        <ul>${rows.map(r=>SPECIAL.includes(r.div)
          ? `<li class="sp"><span class="it">${esc(r.div)}${r.item?'　'+esc(r.item):''}</span></li>`
          : `<li><span class="dv">${esc(r.div)}</span><span class="it">${esc(r.item)}</span></li>`).join('')}</ul>
      </div>`;}).join('')}</div>`;
}

function render(){
  if(VIEW==='cal'){
    document.getElementById('body').innerHTML=calendar();
    document.getElementById('cnt').textContent='共 3 個比賽日';
    return;
  }
  const fd=document.getElementById('fdiv').value, fi=document.getElementById('fitem').value;
  const list=EV.filter(e=>(!fd||e.div===fd)&&(!fi||e.item===fi));
  document.getElementById('body').innerHTML=list.map(ev=>`
    <section id="ev-${esc(ev.div+ev.item)}">
      <div class="sechd">
        <div><div class="eyebrow">${esc(ev.div)}</div><h2 class="serif">${esc(ev.item)}</h2></div>
        <div class="meta">抽籤紀錄碼 ${esc(ev.code)}</div>
      </div>
      ${advNote(ev)}${finalNote(ev)}
      <div class="grid">${ev.groups.map(g=>card(ev,g)).join('')}</div>
    </section>`).join('') || '<p style="color:var(--muted);padding:40px 0">沒有符合的項目。</p>';
  document.getElementById('cnt').textContent=`顯示 ${list.length} / ${EV.length} 個項目`;
}

/* ---------- 查詢 ---------- */
const IDX=[];
EV.forEach(ev=>ev.groups.forEach(g=>g.members.forEach(p=>{
  IDX.push({ev,g,p,key:(p.nm+' '+(p.u||'')+' '+(p.mem||'')).toLowerCase()});
})));
document.getElementById('q').oninput=e=>{
  const q=e.target.value.trim().toLowerCase();
  const box=document.getElementById('hits');
  hl=new Set();
  if(q.length<1){ box.innerHTML=''; render(); return; }
  const hits=IDX.filter(x=>x.key.includes(q)).slice(0,40);
  hits.forEach(x=>{hl.add(x.p.nm); if(x.p.u) hl.add(x.p.u);});
  box.innerHTML=hits.length?`<div class="hits"><h4>查詢結果　${hits.length} 筆</h4>`+
    hits.map((x,i)=>`<div class="hit"><span class="who">${esc(x.p.nm)}</span>
      ${x.p.u?`<span class="where">${esc(x.p.u)}</span>`:''}
      <span class="where">｜${esc(x.ev.div)} ${esc(x.ev.item)}　${esc(x.g.g)} 第 ${x.p.n} 號${x.p.s?`　種子 ${x.p.s}`:''}</span>

      <button class="go" data-i="${i}">看分組</button></div>`).join('')+'</div>'
    :`<div class="hits"><h4>查詢結果</h4><div class="hit">找不到「${esc(q)}」。</div></div>`;
  render();
  box.querySelectorAll('.go').forEach((b,i)=>b.onclick=()=>{
    const x=hits[i];
    document.getElementById('fdiv').value=x.ev.div;
    fillItems(); document.getElementById('fitem').value=x.ev.item; render();
    document.getElementById('ev-'+x.ev.div+x.ev.item).scrollIntoView({behavior:'smooth'});
  });
};
function fillItems(){
  const fd=document.getElementById('fdiv').value;
  const items=[...new Set(EV.filter(e=>!fd||e.div===fd).map(e=>e.item))];
  document.getElementById('fitem').innerHTML='<option value="">全部項目</option>'+
    items.map(i=>`<option>${i}</option>`).join('');
}
document.getElementById('fdiv').innerHTML='<option value="">全部組別</option>'+
  [...new Set(EV.map(e=>e.div))].map(d=>`<option>${d}</option>`).join('');
document.getElementById('fdiv').onchange=()=>{fillItems();render();};
document.getElementById('fitem').onchange=render;
fillItems();
document.getElementById('view').onchange=e=>{
  VIEW=e.target.value;
  const off=VIEW==='cal';
  document.getElementById('q').style.display=off?'none':'';
  document.getElementById('fdiv').style.display=off?'none':'';
  document.getElementById('fitem').style.display=off?'none':'';
  if(off){ document.getElementById('hits').innerHTML=''; document.getElementById('q').value=''; hl=new Set(); }
  render(); window.scrollTo({top:0,behavior:'smooth'});
};

function drawDate(){
  const ds=EV.map(e=>e.at.split(' ')[0]).sort((a,b)=>{
    const p=x=>x.split('/').map(Number);
    const [ay,am,ad]=p(a),[by,bm,bd]=p(b);
    return ay-by||am-bm||ad-bd;
  });
  return ds[ds.length-1];
}
document.getElementById('hdsub').innerHTML=
  `共 <b>${EV.length}</b> 個項目<br>抽籤日期 ${esc(drawDate())}`;
document.getElementById('foot').innerHTML=
  `圓圈內的號碼是組內序號，連線代表兩隊之間要進行的一場比賽——三隊小組打 3 場、四隊小組打 6 場。<br>
   個人項目以選手姓名為主、下方藍字為所屬隊名／單位（未填者不顯示）；團體項目（三點雙打）以隊名為主，下方列出全部隊員。紅色圓框為種子。各項目的抽籤紀錄碼與抽籤時間可對照抽籤系統的紀錄。<br>
   本頁僅公告預賽分組。決賽籤位一律由武士盃競賽系統重新自動抽籤，於賽事當日預賽完賽後自動公告；競技青年團體則為當日現場由各隊抽籤。各項目競賽日期為預定版本，最終賽程以大會 9/9 前公告為準。資料由抽籤系統匯出，如有疑義以大會公告為準。`;
render();
</script>
</body>
</html>
